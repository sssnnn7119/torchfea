[project]
name = "torchfea"
version = "1.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.1",
    "pandas>=2.3.3",
    "pypardiso>=0.4.7",
    "pyvista>=0.46.4",
    "gmsh>=4.15.0",
    "pyside6>=6.8.0",
]

[project.gui-scripts]
# GUI entry point (available as `torchfea-ui` after installing torchfea).
torchfea-ui = "torchfea.ui:run_app"
